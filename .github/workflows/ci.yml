name: TP4 - CI Multi-Environnements (Matrix)

on:
  push:
    branches: [ feature-ci-tp4 ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # JOB UNIQUE DE VERIFICATION ET DE BUILD VIA UNE MATRICE
  # -------------------------------------------------------------
  test-and-build:
    strategy:
      # Si une seule combinaison échoue, on laisse les autres continuer pour voir tout ce qui plante
      fail-fast: false
      
      matrix:
        # Exercice principal : Versions d'OS et de Python demandées
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest] # Ajout de windows-latest pour le facultatif
        python-version: ['3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Gestion intelligente de l'installation selon l'OS (Makefile vs direct)
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Contrôle de style (Linting)
        # On ne fait le linting et le type checking qu'une fois (sur ubuntu) pour éviter les doublons inutiles
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pip install flake8 black mypy
          flake8 calculs tests
          black --check calculs tests

      - name: 2. Contrôle des types (Mypy)
        if: startsWith(matrix.os, 'ubuntu')
        run: mypy calculs

      - name: 3. Test de compilation (Exécution)
        run: python main.py

      - name: 4. Exécution des tests et couverture minimal (> 90%)
        # Sous Windows, l'outil "make" n'est pas installé par défaut. On lance la commande pytest brute qui marche partout.
        run: pytest --cov=calculs --cov-report=term-missing --cov-fail-under=90

      - name: 5. Génération de l'exécutable (Build)
        # Étape finale de build requise par l'exercice principal
        run: pyinstaller --onefile --name calculs-snapshot main.py